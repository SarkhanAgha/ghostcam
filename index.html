<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GhostCam">
<title>GhostCam</title>
<style>
:root{--fg:#f2f2f2;--mut:#8b8b8b;--acc:#ffd23f;--line:#2a2a2a;--chip:#141414}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* header */
header{display:flex;gap:6px;align-items:center;padding:8px 10px}
header .sp{flex:1}
.chip{height:34px;min-width:34px;padding:0 11px;border-radius:17px;border:1px solid var(--line);background:var(--chip);font-size:12px;font-weight:600;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#000}
.chip svg{width:18px;height:18px}

/* viewfinder */
#stage{flex:1;position:relative;min-height:0}
#vf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#050505;border-radius:4px;touch-action:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;background:#000}
#video.mirror{transform:scaleX(-1)}
#ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;display:none;will-change:transform,opacity}
#ghost.peek{visibility:hidden}
.gl{position:absolute;background:rgba(255,255,255,.28);pointer-events:none}
.gl.v{top:0;bottom:0;width:1px}.gl.h{left:0;right:0;height:1px}
#grid{position:absolute;inset:0;pointer-events:none}
#edge{position:absolute;pointer-events:none;display:none;border:0 dashed var(--acc)}
#edge.v{top:0;bottom:0;width:0;border-left-width:2px}
#edge.h{left:0;right:0;height:0;border-top-width:2px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#flash.go{opacity:.75;transition:none}
#badge{position:absolute;left:8px;top:8px;padding:4px 8px;border-radius:10px;background:rgba(0,0,0,.55);font-size:11px;font-weight:600;pointer-events:none;display:none}
#msg{position:absolute;inset:0;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut);line-height:1.45}
#msg b{color:var(--fg)}

/* bottom panel */
#panel{padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;height:32px;border:0;border-radius:7px;background:transparent;font-size:15px;font-weight:600;color:var(--mut)}
.seg button.on{background:#2b2b2b;color:var(--fg)}
.seg button[data-mode=full]{font-size:12px}
.row{display:flex;align-items:center;gap:10px;height:26px}
.row label{width:62px;font-size:12px;color:var(--mut)}
.row output{width:40px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:26px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#333;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--fg);margin-top:-8.5px}
input[type=range]::-moz-range-track{height:3px;background:#333;border-radius:2px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--fg)}
.ctl{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 0}
.side{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--chip);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:0}
.side svg{width:24px;height:24px}
.side img{width:100%;height:100%;object-fit:cover;display:none}
#count{position:absolute;right:3px;bottom:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#000;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center}
#shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:transparent;padding:5px}
#shutter::after{content:"";display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .08s}
#shutter:active::after{transform:scale(.88)}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;flex-direction:column;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.sheet.open{display:flex}
.sh-head,.sh-foot{display:flex;align-items:center;gap:8px;padding:10px 12px}
.sh-head b{font-size:16px}.sh-head .sp,.sh-foot .sp{flex:1}
.sh-body{flex:1;overflow:auto;padding:4px 12px 12px;-webkit-overflow-scrolling:touch}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--chip);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item.ref{border-color:var(--acc)}
.item img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#000}
.item .meta{padding:6px 8px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.item .acts{display:flex;border-top:1px solid var(--line)}
.item .acts button{flex:1;height:34px;border:0;background:transparent;font-size:12px;font-weight:600}
.item .acts button+button{border-left:1px solid var(--line)}
.empty{color:var(--mut);text-align:center;padding:40px 10px;line-height:1.5}
#stitchImg{max-width:100%;max-height:100%;display:block;margin:auto}
#stitchView .sh-body{display:flex;align-items:center;justify-content:center}
#stitchInfo{font-size:12px;color:var(--mut)}
.primary{background:var(--acc);border-color:var(--acc);color:#000}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.95);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:13px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="chip" id="bGhost" title="Show/hide overlay">Ghost</button>
    <button class="chip" id="bDiff" title="Difference blend: aligned areas turn black">Diff</button>
    <button class="chip" id="bGrid">Grid</button>
    <button class="chip" id="bChain" title="Each new shot becomes the next overlay">Chain</button>
    <span class="sp"></span>
    <button class="chip" id="bFlip" title="Switch camera" aria-label="Switch camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/><path d="M14 9v2h2M10 17v-2H8"/></svg>
    </button>
  </header>

  <div id="stage">
    <div id="vf">
      <video id="video" playsinline muted autoplay></video>
      <img id="ghost" alt="">
      <div id="grid"><i class="gl v" style="left:33.333%"></i><i class="gl v" style="left:66.666%"></i><i class="gl h" style="top:33.333%"></i><i class="gl h" style="top:66.666%"></i></div>
      <div id="edge"></div>
      <div id="badge"></div>
      <div id="flash"></div>
    </div>
    <div id="msg"></div>
  </div>

  <section id="panel">
    <div class="seg" id="modeSeg">
      <button data-mode="full">FULL</button>
      <button data-mode="right" title="Next shot to the right">→</button>
      <button data-mode="left" title="Next shot to the left">←</button>
      <button data-mode="up" title="Next shot above">↑</button>
      <button data-mode="down" title="Next shot below">↓</button>
    </div>
    <div class="row"><label for="op">Opacity</label><input type="range" id="op" min="5" max="100" step="1"><output id="opV"></output></div>
    <div class="row" id="ovRow"><label for="ov">Overlap</label><input type="range" id="ov" min="5" max="70" step="1"><output id="ovV"></output></div>
    <div class="ctl">
      <button class="side" id="bGallery" title="Pick reference from gallery" aria-label="Gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <button id="shutter" aria-label="Take photo"></button>
      <button class="side" id="bTray" title="Session shots" aria-label="Session shots">
        <svg id="trayIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>
        <img id="lastThumb" alt="">
        <span id="count"></span>
      </button>
    </div>
  </section>
</div>

<div class="sheet" id="tray">
  <div class="sh-head"><b>Session</b><span class="sp"></span><button class="chip" id="bCloseTray">Close</button></div>
  <div class="sh-body"><div id="list"></div></div>
  <div class="sh-foot">
    <button class="chip" id="bClear">Clear</button><span class="sp"></span>
    <button class="chip" id="bSaveAll">Save all</button>
    <button class="chip primary" id="bStitch">Stitch</button>
  </div>
</div>

<div class="sheet" id="stitchView">
  <div class="sh-head"><b>Stitched</b><span id="stitchInfo"></span><span class="sp"></span><button class="chip" id="bCloseStitch">Close</button></div>
  <div class="sh-body"><img id="stitchImg" alt="Stitched result"></div>
  <div class="sh-foot"><button class="chip" id="bCrop">Crop</button><span class="sp"></span><button class="chip primary" id="bSaveStitch">Save</button></div>
</div>

<input type="file" id="file" accept="image/*" multiple hidden>
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const video = $('#video'), ghost = $('#ghost'), vf = $('#vf'), stage = $('#stage'), edge = $('#edge');

/* ---------- settings ---------- */
const DEF = {mode:'full', op:45, ov:30, ghost:true, diff:false, grid:true, chain:true, facing:'environment'};
let S = {...DEF};
try { S = {...DEF, ...JSON.parse(localStorage.getItem('ghostcam') || '{}')}; } catch (_) {}
const persist = () => { try { localStorage.setItem('ghostcam', JSON.stringify(S)); } catch (_) {} };

/* ---------- state ---------- */
let stream = null, mirrored = false, aspect = 3/4;
let shots = [];           // {id, blob, url, w, h, src, rel:{refId,dir,ov}|null, t}
let refId = null, nextId = 1, stitchBlob = null, wakeLock = null;

/* ---------- utils ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastT;
function toast(t, ms = 2200) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms); }
function showMsg(html) { const m = $('#msg'); m.innerHTML = html; m.style.display = 'flex'; }
function hideMsg() { $('#msg').style.display = 'none'; }
const toBlob = (c, q = 0.92) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
async function loadImage(src) { const im = new Image(); im.decoding = 'async'; im.src = src; await im.decode(); return im; }
const shotById = id => shots.find(s => s.id === id);

/* ---------- camera ---------- */
function stopCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showMsg(window.isSecureContext
      ? '<b>Camera API not available in this browser.</b>You can still load images from the gallery.'
      : '<b>Camera needs HTTPS.</b>Open this page from an https:// address (GitHub Pages, Netlify, your own domain).<br>Gallery loading still works.');
    return;
  }
  stopCamera();
  const base = {facingMode: {ideal: S.facing}};
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{...base, width:{ideal:3840}, height:{ideal:2160}}});
  } catch (e) {
    try { stream = await navigator.mediaDevices.getUserMedia({audio:false, video:base}); }
    catch (e2) {
      showMsg(`<b>Camera unavailable</b>${(e2 && (e2.name + ': ' + e2.message)) || e2}<button class="chip" id="bRetry">Retry</button>`);
      $('#bRetry').onclick = startCamera;
      return;
    }
  }
  video.srcObject = stream;
  try { await video.play(); } catch (_) {}
  const st = stream.getVideoTracks()[0].getSettings ? stream.getVideoTracks()[0].getSettings() : {};
  mirrored = st.facingMode ? st.facingMode === 'user' : S.facing === 'user';
  video.classList.toggle('mirror', mirrored);
  hideMsg();
  layout();
  requestWake();
}

async function requestWake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const tr = stream && stream.getVideoTracks()[0];
    if (!tr || tr.readyState === 'ended') startCamera(); else requestWake();
  }
});

/* ---------- layout: viewfinder takes the camera's exact aspect ---------- */
function layout() {
  if (video.videoWidth && video.videoHeight) aspect = video.videoWidth / video.videoHeight;
  else { const r = shotById(refId); if (r) aspect = r.w / r.h; }
  const r = stage.getBoundingClientRect();
  let w = r.width, h = w / aspect;
  if (h > r.height) { h = r.height; w = h * aspect; }
  vf.style.width = Math.floor(w) + 'px';
  vf.style.height = Math.floor(h) + 'px';
}
video.addEventListener('loadedmetadata', layout);
video.addEventListener('resize', layout);
new ResizeObserver(layout).observe(stage);

/* ---------- overlay ---------- */
function render() {
  const on = S.ghost && refId != null;
  ghost.style.display = on ? 'block' : 'none';
  ghost.style.opacity = S.op / 100;
  ghost.style.mixBlendMode = S.diff ? 'difference' : 'normal';
  const k = 100 - S.ov;
  ghost.style.transform = {
    full: 'none',
    right: `translateX(-${k}%)`,   // previous frame's RIGHT strip sits on the LEFT of the view
    left:  `translateX(${k}%)`,
    down:  `translateY(-${k}%)`,
    up:    `translateY(${k}%)`
  }[S.mode];

  const adj = S.mode !== 'full';
  edge.style.display = on && adj ? 'block' : 'none';
  edge.className = (S.mode === 'right' || S.mode === 'left') ? 'v' : 'h';
  edge.style.left = edge.style.top = '';
  if (S.mode === 'right') edge.style.left = S.ov + '%';
  if (S.mode === 'left')  edge.style.left = (100 - S.ov) + '%';
  if (S.mode === 'down')  edge.style.top = S.ov + '%';
  if (S.mode === 'up')    edge.style.top = (100 - S.ov) + '%';

  $('#ovRow').style.display = adj ? 'flex' : 'none';
  $('#grid').style.display = S.grid ? 'block' : 'none';
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  $('#bGhost').classList.toggle('on', S.ghost);
  $('#bDiff').classList.toggle('on', S.diff);
  $('#bGrid').classList.toggle('on', S.grid);
  $('#bChain').classList.toggle('on', S.chain);
  $('#op').value = S.op; $('#opV').textContent = S.op + '%';
  $('#ov').value = S.ov; $('#ovV').textContent = S.ov + '%';

  const badge = $('#badge');
  const ref = shotById(refId);
  if (ref) { badge.style.display = 'block'; badge.textContent = `Ghost #${ref.id}` + (adj ? `  ${({right:'→',left:'←',up:'↑',down:'↓'})[S.mode]} ${S.ov}%` : ''); }
  else badge.style.display = 'none';

  const last = shots[shots.length - 1];
  const lt = $('#lastThumb'), cnt = $('#count');
  if (last) { lt.src = last.url; lt.style.display = 'block'; $('#trayIco').style.display = 'none'; cnt.textContent = shots.length; cnt.style.display = 'flex'; }
  else { lt.style.display = 'none'; $('#trayIco').style.display = 'block'; cnt.style.display = 'none'; }
  persist();
}

function setRef(id) {
  refId = id;
  const s = shotById(id);
  if (s) ghost.src = s.url; else ghost.removeAttribute('src');
  if (!video.videoWidth) layout();
  render();
}

/* press-and-hold on the viewfinder = peek without the ghost */
vf.addEventListener('pointerdown', () => ghost.classList.add('peek'));
['pointerup','pointercancel','pointerleave'].forEach(e => vf.addEventListener(e, () => ghost.classList.remove('peek')));

/* ---------- shots ---------- */
function addShot(blob, w, h, src, rel) {
  const s = {id: nextId++, blob, url: URL.createObjectURL(blob), w, h, src, rel, t: stamp()};
  shots.push(s);
  return s;
}

async function capture() {
  if (!video.videoWidth) { toast('Camera not ready'); return; }
  const w = video.videoWidth, h = video.videoHeight;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  if (mirrored) { x.translate(w, 0); x.scale(-1, 1); }
  x.drawImage(video, 0, 0, w, h);
  const f = $('#flash'); f.classList.add('go'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('go')));
  if (navigator.vibrate) navigator.vibrate(15);
  const blob = await toBlob(c);
  const rel = (refId != null && S.ghost && S.mode !== 'full') ? {refId, dir: S.mode, ov: S.ov / 100} : null;
  const s = addShot(blob, w, h, 'cam', rel);
  if (rel) loadCV().catch(() => {});   // warm up the stitcher in the background
  if (S.chain) setRef(s.id); else render();
}

/* gallery → crop to camera aspect so overlay geometry matches the live frame */
async function importFiles(files) {
  let last = null;
  for (const f of files) {
    const u = URL.createObjectURL(f);
    try {
      const im = await loadImage(u);
      let iw = im.naturalWidth, ih = im.naturalHeight, sx = 0, sy = 0, sw = iw, sh = ih;
      if (video.videoWidth) {
        const A = video.videoWidth / video.videoHeight;
        if (iw / ih > A) { sw = Math.round(ih * A); sx = (iw - sw) / 2; }
        else { sh = Math.round(iw / A); sy = (ih - sh) / 2; }
      }
      const lim = Math.max(video.videoWidth, video.videoHeight, 1920);
      const sc = Math.min(1, lim / Math.max(sw, sh));
      const c = document.createElement('canvas');
      c.width = Math.round(sw * sc); c.height = Math.round(sh * sc);
      c.getContext('2d').drawImage(im, sx, sy, sw, sh, 0, 0, c.width, c.height);
      last = addShot(await toBlob(c), c.width, c.height, 'gallery', null);
    } catch (e) { toast('Could not read ' + f.name); }
    finally { URL.revokeObjectURL(u); }
  }
  if (last) { setRef(last.id); toast('Loaded as ghost'); }
}

function deleteShot(id) {
  const i = shots.findIndex(s => s.id === id); if (i < 0) return;
  URL.revokeObjectURL(shots[i].url); shots.splice(i, 1);
  if (refId === id) setRef(null);
  render(); renderTray();
}

/* ---------- saving ---------- */
async function saveFiles(items) {   // [{blob, name}]
  const files = items.map(i => new File([i.blob], i.name, {type: 'image/jpeg'}));
  if (navigator.canShare && navigator.share) {
    try { if (navigator.canShare({files})) { await navigator.share({files}); return; } }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  for (const f of files) {
    const a = document.createElement('a'), u = URL.createObjectURL(f);
    a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 5000);
    await sleep(300);
  }
}
const fname = s => `ghostcam_${s.t}_${String(s.id).padStart(3, '0')}.jpg`;

/* ---------- tray ---------- */
const ARW = {right:'→', left:'←', up:'↑', down:'↓'};
function renderTray() {
  const L = $('#list');
  if (!shots.length) { L.innerHTML = '<div class="empty" style="grid-column:1/-1">No shots yet.<br>Take a photo or load one from the gallery.</div>'; return; }
  L.innerHTML = shots.map(s => `
    <div class="item${s.id === refId ? ' ref' : ''}" data-id="${s.id}">
      <img src="${s.url}" alt="" data-act="ref">
      <div class="meta"><span>#${s.id}${s.src === 'gallery' ? ' · gallery' : ''}</span><span>${s.rel ? `${ARW[s.rel.dir]} #${s.rel.refId} · ${Math.round(s.rel.ov * 100)}%` : ''}</span></div>
      <div class="acts"><button data-act="ref">${s.id === refId ? 'Ghost ✓' : 'Ghost'}</button><button data-act="save">Save</button><button data-act="del">Del</button></div>
    </div>`).join('');
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'), it = e.target.closest('.item'); if (!b || !it) return;
  const id = +it.dataset.id, s = shotById(id);
  if (b.dataset.act === 'ref') { setRef(id); closeSheet('#tray'); }
  else if (b.dataset.act === 'save') saveFiles([{blob: s.blob, name: fname(s)}]);
  else if (b.dataset.act === 'del') deleteShot(id);
});
function openSheet(sel) { $(sel).classList.add('open'); }
function closeSheet(sel) { $(sel).classList.remove('open'); }

/* ---------- stitching ---------- */
/* Chain = newest linked shot walked back through its ref links. */
function chainFrom(end) {
  const chain = []; let cur = end;
  const seen = new Set();
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id); chain.unshift(cur);
    if (!cur.rel) break;
    cur = shotById(cur.rel.refId);
  }
  return chain;
}

const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* where the current frame sits relative to the previous one, as the overlap setting assumes:
   x_prev = x_cur + tx, y_prev = y_cur + ty */
function priorShift(rel, W, H) {
  const k = 1 - rel.ov;
  return {right: [W * k, 0], left: [-W * k, 0], down: [0, H * k], up: [0, -H * k]}[rel.dir];
}

/* 3×3 row-major homography helpers */
const M3 = {
  I: () => [1,0,0, 0,1,0, 0,0,1],
  T: (x, y) => [1,0,x, 0,1,y, 0,0,1],
  S: s => [s,0,0, 0,s,0, 0,0,1],
  mul(a, b) { const r = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r[i*3+j] = a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j]; return r; },
  inv(m) {
    const [a,b,c,d,e,f,g,h,i] = m;
    const A = e*i - f*h, B = -(d*i - f*g), C = d*h - e*g, det = a*A + b*B + c*C;
    if (Math.abs(det) < 1e-12) return null;
    return [A/det, -(b*i - c*h)/det, (b*f - c*e)/det, B/det, (a*i - c*g)/det, -(a*f - c*d)/det, C/det, -(a*h - b*g)/det, (a*e - b*d)/det];
  },
  ap(m, x, y) { const w = m[6]*x + m[7]*y + m[8]; return [(m[0]*x + m[1]*y + m[2]) / w, (m[3]*x + m[4]*y + m[5]) / w, w]; }
};

/* ---- OpenCV.js: vendored next to index.html, loaded once on demand ---- */
let cvPromise = null;
function loadCV() {
  if (cvPromise) return cvPromise;
  cvPromise = new Promise((resolve, reject) => {
    const ready = () => window.cv && window.cv.Mat && window.cv.ORB;
    if (ready()) return resolve();   // never resolve WITH cv: the Emscripten module is a thenable and would loop forever
    const s = document.createElement('script');
    s.src = 'opencv.js'; s.async = true;
    s.onerror = () => { cvPromise = null; reject(new Error('opencv.js failed to load')); };
    document.head.appendChild(s);
    const t0 = Date.now(); let hooked = false;
    (function poll() {
      if (window.cv && !window.cv.Mat && typeof window.cv.then === 'function' && !hooked) { hooked = true; window.cv.then(m => { window.cv = m; }); }
      if (ready()) return resolve();
      if (Date.now() - t0 > 120000) { cvPromise = null; return reject(new Error('opencv.js timeout')); }
      setTimeout(poll, 100);
    })();
  });
  return cvPromise;
}

/* Search region for features: the overlap band (+15% slack) on the trailing side of prev / leading side of cur. */
function bandRect(cv, rel, which, w, h) {
  const f = Math.min(1, rel.ov + 0.15), bw = Math.round(w * f), bh = Math.round(h * f);
  const trail = which === 'prev';
  const side = {right: trail ? 'R' : 'L', left: trail ? 'L' : 'R', down: trail ? 'B' : 'T', up: trail ? 'T' : 'B'}[rel.dir];
  return side === 'R' ? new cv.Rect(w - bw, 0, bw, h) : side === 'L' ? new cv.Rect(0, 0, bw, h)
       : side === 'B' ? new cv.Rect(0, h - bh, w, bh) : new cv.Rect(0, 0, w, bh);
}

/* ORB + ratio test + prior-consistency gate + RANSAC homography (affine when evidence is thin).
   Works in detection resolution; returns H mapping cur → prev in that resolution. */
function estimatePair(cv, gPrev, gCur, rel, dw, dh) {
  const bag = []; const k = o => (bag.push(o), o);
  try {
    const mp = k(cv.Mat.zeros(dh, dw, cv.CV_8U)), mc = k(cv.Mat.zeros(dh, dw, cv.CV_8U));
    let r = mp.roi(bandRect(cv, rel, 'prev', dw, dh)); r.setTo(new cv.Scalar(255)); r.delete();
    r = mc.roi(bandRect(cv, rel, 'cur', dw, dh)); r.setTo(new cv.Scalar(255)); r.delete();
    const orb = k(new cv.ORB(4000));
    const k1 = k(new cv.KeyPointVector()), k2 = k(new cv.KeyPointVector()), d1 = k(new cv.Mat()), d2 = k(new cv.Mat());
    orb.detectAndCompute(gPrev, mp, k1, d1);
    orb.detectAndCompute(gCur, mc, k2, d2);
    if (d1.rows < 15 || d2.rows < 15) return {ok: false, why: 'too little texture'};
    const bf = k(new cv.BFMatcher(cv.NORM_HAMMING, false)), mv = k(new cv.DMatchVectorVector());
    bf.knnMatch(d2, d1, mv, 2);
    const [tx, ty] = priorShift(rel, dw, dh), gate = 0.3 * Math.max(dw, dh);
    const src = [], dst = [];
    for (let i = 0; i < mv.size(); i++) {
      const pr = mv.get(i);
      if (pr.size() >= 2) {
        const m = pr.get(0), n = pr.get(1);
        if (m.distance < 0.8 * n.distance) {
          const a = k2.get(m.queryIdx).pt, b = k1.get(m.trainIdx).pt;
          if (Math.hypot(a.x + tx - b.x, a.y + ty - b.y) < gate) { src.push(a.x, a.y); dst.push(b.x, b.y); }
        }
      }
      if (pr.delete) pr.delete();
    }
    const n = src.length / 2;
    if (n < 12) return {ok: false, why: `${n} matches`};
    const sm = k(cv.matFromArray(n, 1, cv.CV_32FC2, src)), dm = k(cv.matFromArray(n, 1, cv.CV_32FC2, dst));
    const inl = k(new cv.Mat());
    const Hm = k(cv.findHomography(sm, dm, cv.RANSAC, 3, inl));
    if (Hm.empty()) return {ok: false, why: 'no model'};
    const ni = cv.countNonZero(inl);
    if (ni >= 40 && ni >= 0.25 * n) return {ok: true, H: Array.from(Hm.data64F), inliers: ni, matches: n, model: 'H'};
    // thin evidence: 6-dof affine is far less prone to wild perspective than an 8-dof homography
    const inl2 = k(new cv.Mat());
    const A = k(cv.estimateAffine2D(sm, dm, inl2, cv.RANSAC, 3));
    if (A.empty()) return {ok: false, why: 'no affine'};
    const na = cv.countNonZero(inl2);
    if (na < 12 || na < 0.25 * n) return {ok: false, why: `${na} inliers`};
    const a = A.data64F;
    return {ok: true, H: [a[0], a[1], a[2], a[3], a[4], a[5], 0, 0, 1], inliers: na, matches: n, model: 'A'};
  } finally { bag.forEach(o => { try { o.delete(); } catch (_) {} }); }
}

/* Reject estimates that disagree wildly with where the user aimed. Only the leading edge (inside the overlap)
   and the centre are compared with the aim: far corners legitimately stretch under camera rotation. */
function plausible(Hf, W, H, rel, tx, ty) {
  const C = [[0,0],[W,0],[W,H],[0,H]], q = [];
  for (const [x, y] of C) {
    const p = M3.ap(Hf, x, y);
    if (!(p[2] > 0) || !isFinite(p[0]) || !isFinite(p[1])) return false;
    q.push(p);
  }
  const lead = {right: [0, 3], left: [1, 2], down: [0, 1], up: [2, 3]}[rel.dir], tol = 0.3 * Math.max(W, H);
  for (const i of lead) if (Math.hypot(q[i][0] - (C[i][0] + tx), q[i][1] - (C[i][1] + ty)) > tol) return false;
  const c = M3.ap(Hf, W / 2, H / 2);
  if (Math.hypot(c[0] - (W / 2 + tx), c[1] - (H / 2 + ty)) > 0.4 * Math.max(W, H)) return false;
  let area = 0, sgn = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4], d = q[(i + 2) % 4];
    area += a[0]*b[1] - b[0]*a[1];
    const cr = Math.sign((b[0] - a[0]) * (d[1] - b[1]) - (b[1] - a[1]) * (d[0] - b[0]));
    if (sgn && cr && cr !== sgn) return false;            // non-convex / folded quad
    sgn = sgn || cr;
  }
  const ratio = Math.abs(area / 2) / (W * H);
  return ratio > 0.4 && ratio < 2.5;
}

function distPadded(cv, m) {          // distance to nearest uncovered pixel, image border counts as uncovered
  const p = new cv.Mat(), d = new cv.Mat();
  cv.copyMakeBorder(m, p, 1, 1, 1, 1, cv.BORDER_CONSTANT, new cv.Scalar(0));
  cv.distanceTransform(p, d, cv.DIST_L2, 3);
  const a = d.data32F.slice(); p.delete(); d.delete(); return a;
}

/* Largest-ish axis-aligned rectangle fully inside the covered area (greedy edge shaving on a coarse grid). */
function autoCrop(union, cw, ch) {
  const f = Math.max(1, Math.ceil(Math.max(cw, ch) / 1200)), gw = Math.floor(cw / f), gh = Math.floor(ch / f);
  const g = new Uint8Array(gw * gh);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) g[y*gw + x] = union[(y*f + (f >> 1)) * cw + x*f + (f >> 1)] ? 1 : 0;
  let t = 0, b = gh - 1, l = 0, r = gw - 1;
  const rowMiss = y => { let c = 0; for (let x = l; x <= r; x++) c += !g[y*gw + x]; return c / (r - l + 1); };
  const colMiss = x => { let c = 0; for (let y = t; y <= b; y++) c += !g[y*gw + x]; return c / (b - t + 1); };
  for (let it = 0; it < gw + gh; it++) {
    const m = {t: rowMiss(t), b: rowMiss(b), l: colMiss(l), r: colMiss(r)};
    const key = Object.keys(m).reduce((a, c) => m[c] > m[a] ? c : a, 't');
    if (m[key] === 0) break;
    if (key === 't') t++; else if (key === 'b') b--; else if (key === 'l') l++; else r--;
    if (b - t < gh * 0.2 || r - l < gw * 0.2) return null;
  }
  const x0 = (l ? l + 1 : 0) * f, y0 = (t ? t + 1 : 0) * f;
  const x1 = Math.min(cw, (r < gw - 1 ? r : gw) * f), y1 = Math.min(ch, (b < gh - 1 ? b : gh) * f);
  if (x0 === 0 && y0 === 0 && x1 >= cw - f && y1 >= ch - f) return null;
  return {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
}

/* Feature-aligned stitch:
   1. ORB matches inside the expected overlap band; RANSAC homography per link (fallback: overlap prior).
   2. Links chained, re-referenced to the middle frame to spread perspective stretch evenly.
   3. Each frame warped into the panorama; per-channel gain matched to what's already there (exposure/WB).
   4. Seam: distance-weighted feather (weight ∝ distance to each image's own border). */
async function smartStitch(chain, prog = () => {}) {
  const cv = window.cv;
  const n = chain.length, W = chain[0].w, H = chain[0].h;
  const imgs = [];
  for (const s of chain) imgs.push(await loadImage(s.url));

  const sd = Math.min(1, 1000 / Math.max(W, H)), dw = Math.round(W * sd), dh = Math.round(H * sd);
  const grays = imgs.map(im => {
    const c = mkCanvas(dw, dh); c.getContext('2d').drawImage(im, 0, 0, dw, dh);
    const m = cv.imread(c), g = new cv.Mat(); cv.cvtColor(m, g, cv.COLOR_RGBA2GRAY); m.delete(); return g;
  });

  const link = [null], how = [];
  for (let i = 1; i < n; i++) {
    prog(`Matching ${i}/${n - 1}…`); await nextFrame();
    const rel = chain[i].rel, [tx, ty] = priorShift(rel, W, H);
    let Hf = M3.T(tx, ty), info = 'overlap';
    try {
      const r = estimatePair(cv, grays[i - 1], grays[i], rel, dw, dh);
      if (r.ok) {
        const h = r.H, cand = [h[0], h[1], h[2] / sd, h[3], h[4], h[5] / sd, h[6] * sd, h[7] * sd, h[8]];
        if (plausible(cand, W, H, rel, tx, ty)) { Hf = cand; info = `${r.model}:${r.inliers}`; }
        else info = 'rejected';
      } else info = r.why;
    } catch (e) { console.warn('match', e); info = 'error'; }
    link.push(Hf); how.push(info);
  }
  grays.forEach(g => g.delete());

  const H0 = [M3.I()];
  for (let i = 1; i < n; i++) H0.push(M3.mul(H0[i - 1], link[i]));
  const mid = Math.floor((n - 1) / 2), Hmi = M3.inv(H0[mid]);
  if (!Hmi) throw new Error('singular chain');
  const G = H0.map(h => M3.mul(Hmi, h));

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const g of G) for (const [x, y] of [[0,0],[W,0],[W,H],[0,H]]) {
    const p = M3.ap(g, x, y);
    if (!(p[2] > 0)) throw new Error('frame behind camera');
    minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
  }
  const OW = maxX - minX, OH = maxY - minY;
  if (!(OW * OH < n * W * H * 3)) throw new Error('panorama too stretched');
  const so = Math.min(1, 8192 / Math.max(OW, OH), Math.sqrt(16e6 / (OW * OH)));   // mobile canvas limits
  const cw = Math.ceil(OW * so), ch = Math.ceil(OH * so);
  const out = mkCanvas(cw, ch), octx = out.getContext('2d', {willReadFrequently: true});
  octx.fillStyle = '#000'; octx.fillRect(0, 0, cw, ch);
  const union = new Uint8Array(cw * ch);
  const base = M3.mul(M3.S(so), M3.T(-minX, -minY));
  const si = Math.min(1, so * 1.25), sw = Math.round(W * si), sh = Math.round(H * si);
  const gains = [];

  for (let i = 0; i < n; i++) {
    prog(`Blending ${i + 1}/${n}…`); await nextFrame();
    const P = M3.mul(base, G[i]);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of [[0,0],[W,0],[W,H],[0,H]]) { const p = M3.ap(P, x, y); x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    const rx = Math.max(0, Math.floor(x0)), ry = Math.max(0, Math.floor(y0));
    const rw = Math.min(cw, Math.ceil(x1)) - rx, rh = Math.min(ch, Math.ceil(y1)) - ry;
    if (rw < 2 || rh < 2) continue;

    const c = mkCanvas(sw, sh); c.getContext('2d').drawImage(imgs[i], 0, 0, sw, sh);
    const src = cv.imread(c); c.width = c.height = 0;
    const Mm = cv.matFromArray(3, 3, cv.CV_64F, M3.mul(M3.mul(M3.T(-rx, -ry), P), M3.S(1 / si)));
    const warped = new cv.Mat();
    cv.warpPerspective(src, warped, Mm, new cv.Size(rw, rh), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(0, 0, 0, 0));
    src.delete(); Mm.delete();
    const wd = warped.data, N = rw * rh;

    const mask = new cv.Mat(rh, rw, cv.CV_8U), md = mask.data;
    for (let p = 0, q = 3; p < N; p++, q += 4) md[p] = wd[q] === 255 ? 255 : 0;
    const kern = cv.Mat.ones(3, 3, cv.CV_8U);
    cv.erode(mask, mask, kern, new cv.Point(-1, -1), 1, cv.BORDER_CONSTANT, new cv.Scalar(0));
    kern.delete();

    const um = new cv.Mat(rh, rw, cv.CV_8U), ud = um.data;
    let overlap = false;
    for (let y = 0; y < rh; y++) { const off = (y + ry) * cw + rx; ud.set(union.subarray(off, off + rw), y * rw); }
    for (let p = 0; p < N; p++) if (md[p] && ud[p]) { overlap = true; break; }

    const img = octx.getImageData(rx, ry, rw, rh), od = img.data;
    let g0 = 1, g1 = 1, g2 = 1, dI = null, dU = null;
    if (overlap) {
      let a0 = 0, a1 = 0, a2 = 0, b0 = 0, b1 = 0, b2 = 0, cnt = 0;
      for (let p = 0, q = 0; p < N; p++, q += 4) if (md[p] && ud[p]) {
        a0 += od[q]; a1 += od[q+1]; a2 += od[q+2]; b0 += wd[q]; b1 += wd[q+1]; b2 += wd[q+2]; cnt++;
      }
      if (cnt > 500) { g0 = clamp(a0 / Math.max(b0, 1), 0.6, 1.6); g1 = clamp(a1 / Math.max(b1, 1), 0.6, 1.6); g2 = clamp(a2 / Math.max(b2, 1), 0.6, 1.6); }
      dI = distPadded(cv, mask); dU = distPadded(cv, um);
    }
    gains.push([g0, g1, g2].map(v => +v.toFixed(2)));

    const pw = rw + 2;
    for (let y = 0; y < rh; y++) {
      const urow = (y + ry) * cw + rx;
      for (let x = 0; x < rw; x++) {
        const p = y * rw + x;
        if (!md[p]) continue;
        const q = p * 4;
        let a = 1;
        if (overlap && ud[p]) { const j = (y + 1) * pw + x + 1, di = dI[j], du = dU[j]; a = di / (di + du + 1e-6); }
        const b = 1 - a;
        od[q]   = wd[q]   * g0 * a + od[q]   * b;
        od[q+1] = wd[q+1] * g1 * a + od[q+1] * b;
        od[q+2] = wd[q+2] * g2 * a + od[q+2] * b;
        od[q+3] = 255;
        union[urow + x] = 255;
      }
    }
    octx.putImageData(img, rx, ry);
    warped.delete(); mask.delete(); um.delete();
  }
  const aligned = how.filter(h => /^[HA]:/.test(h)).length;
  return {canvas: out, crop: autoCrop(union, cw, ch), aligned, links: n - 1, how, gains};
}

/* Fallback: pure overlap-prior placement with linear feather (no OpenCV). */
async function basicStitch(chain) {
  const W = chain[0].w, H = chain[0].h;
  const pos = [[0, 0]]; let x = 0, y = 0;
  for (let i = 1; i < chain.length; i++) { const [tx, ty] = priorShift(chain[i].rel, W, H); x += tx; y += ty; pos.push([x, y]); }
  const minX = Math.min(...pos.map(p => p[0])), minY = Math.min(...pos.map(p => p[1]));
  const OW = Math.max(...pos.map(p => p[0])) + W - minX, OH = Math.max(...pos.map(p => p[1])) + H - minY;
  const s = Math.min(1, 8192 / Math.max(OW, OH), Math.sqrt(16e6 / (OW * OH)));
  const out = mkCanvas(Math.round(OW * s), Math.round(OH * s));
  const o = out.getContext('2d'); o.fillStyle = '#000'; o.fillRect(0, 0, out.width, out.height);
  const tw = Math.round(W * s), th = Math.round(H * s);
  for (let i = 0; i < chain.length; i++) {
    const im = await loadImage(chain[i].url);
    const dx = Math.round((pos[i][0] - minX) * s), dy = Math.round((pos[i][1] - minY) * s);
    if (i === 0) { o.drawImage(im, dx, dy, tw, th); continue; }
    const t = mkCanvas(tw, th), tc = t.getContext('2d');
    tc.drawImage(im, 0, 0, tw, th);
    const {dir, ov} = chain[i].rel;
    const g = dir === 'right' ? tc.createLinearGradient(0, 0, tw * ov, 0) : dir === 'left' ? tc.createLinearGradient(tw, 0, tw * (1 - ov), 0)
            : dir === 'down' ? tc.createLinearGradient(0, 0, 0, th * ov) : tc.createLinearGradient(0, th, 0, th * (1 - ov));
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
    tc.globalCompositeOperation = 'destination-in'; tc.fillStyle = g; tc.fillRect(0, 0, tw, th);
    o.drawImage(t, dx, dy);
  }
  return {canvas: out, crop: null, aligned: 0, links: chain.length - 1, basic: true};
}

window.GhostStitch = {smartStitch, basicStitch, loadCV, autoCrop};   // exposed for testing

let stitchRes = null, cropOn = true, busy = false;
async function showStitch() {
  const r = stitchRes; if (!r) return;
  const useCrop = cropOn && r.crop;
  let c = r.canvas;
  if (useCrop) { c = mkCanvas(r.crop.w, r.crop.h); c.getContext('2d').drawImage(r.canvas, r.crop.x, r.crop.y, r.crop.w, r.crop.h, 0, 0, r.crop.w, r.crop.h); }
  stitchBlob = await toBlob(c, 0.93);
  const img = $('#stitchImg');
  if (img.src) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(stitchBlob);
  $('#bCrop').style.display = r.crop ? 'inline-flex' : 'none';
  $('#bCrop').classList.toggle('on', !!useCrop);
  $('#stitchInfo').textContent = `${r.links + 1} shots · ` + (r.basic ? 'basic' : `${r.aligned}/${r.links} aligned`) + ` · ${c.width}×${c.height}`;
}

async function stitch() {
  if (busy) return;
  const end = [...shots].reverse().find(s => s.rel);
  const chain = end ? chainFrom(end) : [];
  if (chain.length < 2) { toast('No linked sequence. Shoot in → ← ↑ ↓ mode, aligning each shot to the ghost strip.', 3500); return; }
  busy = true;
  try {
    let res = null;
    try {
      toast('Loading stitcher…', 60000);
      await loadCV();
      res = await smartStitch(chain, t => toast(t, 60000));
    } catch (e) {
      console.warn('smart stitch failed', e);
      toast('Smart stitch unavailable, using basic', 2500);
      res = await basicStitch(chain);
    }
    stitchRes = res; cropOn = true;
    await showStitch();
    if (!res.basic) toast(res.aligned === res.links ? 'All seams feature-aligned' : `${res.links - res.aligned} seam(s) used overlap guess (low texture)`, 2500);
    openSheet('#stitchView');
  } finally { busy = false; }
}

$('#bDiff').onclick  = () => { S.diff = !S.diff; render(); };
$('#bGrid').onclick  = () => { S.grid = !S.grid; render(); };
$('#bChain').onclick = () => { S.chain = !S.chain; render(); toast(S.chain ? 'Chain on: each shot becomes the next ghost' : 'Chain off: ghost stays fixed'); };
$('#bFlip').onclick  = () => { S.facing = S.facing === 'user' ? 'environment' : 'user'; persist(); startCamera(); };
$('#shutter').onclick = capture;
$('#bGallery').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) importFiles(f); };
$('#bTray').onclick = () => { renderTray(); openSheet('#tray'); };
$('#bCloseTray').onclick = () => closeSheet('#tray');
$('#bSaveAll').onclick = () => shots.length ? saveFiles(shots.map(s => ({blob: s.blob, name: fname(s)}))) : toast('Nothing to save');
$('#bStitch').onclick = () => { closeSheet('#tray'); stitch(); };
$('#bCloseStitch').onclick = () => closeSheet('#stitchView');
$('#bCrop').onclick = () => { cropOn = !cropOn; showStitch(); };
$('#bSaveStitch').onclick = () => stitchBlob && saveFiles([{blob: stitchBlob, name: `ghostcam_${stamp()}_stitch.jpg`}]);
let clearArm = 0;
$('#bClear').onclick = () => {
  if (Date.now() - clearArm > 2500) { clearArm = Date.now(); toast('Tap Clear again to delete all session shots'); return; }
  shots.forEach(s => URL.revokeObjectURL(s.url)); shots = []; setRef(null); renderTray(); clearArm = 0;
};
document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); capture(); } });
window.addEventListener('beforeunload', e => { if (shots.length) { e.preventDefault(); e.returnValue = ''; } });

render();
startCamera();
})();
</script>
</body>
</html>
